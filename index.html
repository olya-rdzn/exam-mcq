<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Geography Midterm Exam Host</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="questions.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #121826; color: white; margin: 0; padding: 20px; text-align: center; }
    .card { background: #1f293d; border-radius: 12px; padding: 30px; max-width: 900px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
    .option { padding: 25px; font-size: 1.5rem; font-weight: bold; border-radius: 10px; color: white; text-align: left; }
    .opt-0 { background: #e21b3c; }
    .opt-1 { background: #1368ce; }
    .opt-2 { background: #d89e00; }
    .opt-3 { background: #26890c; }
    .timer { font-size: 3rem; font-weight: bold; color: #ff4757; }
    .counter { font-size: 1.5rem; color: #4bcffa; margin: 15px 0; }
    #qrcode { background: white; padding: 15px; display: inline-block; border-radius: 10px; margin: 20px 0; }
    button { background: #00d2d3; border: none; padding: 15px 30px; font-size: 1.2rem; font-weight: bold; border-radius: 8px; cursor: pointer; color: #121826; }
    button:hover { background: #54a0ff; }
  </style>
</head>
<body>

  <div class="card" id="lobby">
    <h1>Geography Midterm Exam</h1>
    <p>Scan the QR code to join on your phone:</p>
    <div id="qrcode"></div>
    <h3>Students Joined: <span id="student-count">0</span></h3>
    <button onclick="startGame()">Start Exam</button>
  </div>

  <div class="card" id="game" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 id="q-number">Question 1</h2>
      <div class="timer" id="timer">45</div>
    </div>
    <h1 id="q-text" style="font-size: 2.2rem; min-height: 100px;">Question text...</h1>
    
    <div class="counter">Answers Received: <span id="answer-count">0</span> / <span id="total-connected">0</span></div>

    <div class="grid">
      <div class="option opt-0" id="opt-0">A. </div>
      <div class="option opt-1" id="opt-1">B. </div>
      <div class="option opt-2" id="opt-2">C. </div>
      <div class="option opt-3" id="opt-3">D. </div>
    </div>
  </div>

  <div class="card" id="end-screen" style="display: none;">
    <h1>Exam Finished!</h1>
    <p>All answers have been recorded in Supabase.</p>
  </div>

  <script>
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentQIndex = 0;
    let timerInterval = null;
    let timeLeft = 45;
    let totalStudentsCount = 0;
    let answersReceived = 0;

    // Generate QR Code dynamically pointing to student page
    const studentUrl = window.location.href.replace('index.html', 'student.html');
    new QRCode(document.getElementById("qrcode"), { text: studentUrl, width: 200, height: 200 });

    // Reset session state on startup
    db.from('room_state').update({ current_question: 0, game_status: 'waiting', total_students: 0 }).eq('id', 1);
    db.from('students').delete().neq('id', '00000000-0000-0000-0000-000000000000');
    db.from('submissions').delete().neq('question_id', -1);

    // Track joining students
    db.channel('public:students').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'students' }, () => {
      totalStudentsCount++;
      document.getElementById('student-count').innerText = totalStudentsCount;
    }).subscribe();

    // Track answer submissions
    db.channel('public:submissions').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'submissions' }, (payload) => {
      if (payload.new.question_id === EXAM_QUESTIONS[currentQIndex].id) {
        answersReceived++;
        document.getElementById('answer-count').innerText = answersReceived;
        if (answersReceived >= totalStudentsCount && totalStudentsCount > 0) {
          nextQuestion();
        }
      }
    }).subscribe();

    async function startGame() {
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('game').style.display = 'block';
      await db.from('room_state').update({ game_status: 'active', total_students: totalStudentsCount }).eq('id', 1);
      loadQuestion();
    }

    async function loadQuestion() {
      if (currentQIndex >= EXAM_QUESTIONS.length) {
        document.getElementById('game').style.display = 'none';
        document.getElementById('end-screen').style.display = 'block';
        await db.from('room_state').update({ game_status: 'finished' }).eq('id', 1);
        return;
      }

      const q = EXAM_QUESTIONS[currentQIndex];
      document.getElementById('q-number').innerText = `Question ${currentQIndex + 1} of ${EXAM_QUESTIONS.length}`;
      document.getElementById('q-text').innerText = q.question;
      document.getElementById('opt-0').innerText = `A. ${q.options[0]}`;
      document.getElementById('opt-1').innerText = `B. ${q.options[1]}`;
      document.getElementById('opt-2').innerText = `C. ${q.options[2]}`;
      document.getElementById('opt-3').innerText = `D. ${q.options[3]}`;

      answersReceived = 0;
      document.getElementById('answer-count').innerText = "0";
      document.getElementById('total-connected').innerText = totalStudentsCount;

      await db.from('room_state').update({ current_question: q.id }).eq('id', 1);

      timeLeft = 45;
      document.getElementById('timer').innerText = timeLeft;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft;
        if (timeLeft <= 0) {
          nextQuestion();
        }
      }, 1000);
    }

    function nextQuestion() {
      clearInterval(timerInterval);
      currentQIndex++;
      setTimeout(loadQuestion, 1500); // Short pause between questions
    }
  </script>
</body>
</html>
