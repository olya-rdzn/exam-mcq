<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Host</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="config.js"></script>
  <script src="questions.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Verdana, sans-serif; }
    body { background: #121826; color: white; margin: 0; padding: 20px; text-align: center; }
    .card { background: #1f293d; border-radius: 12px; padding: 30px; max-width: 1000px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
    .option { padding: 25px; font-size: 1.6rem; font-weight: bold; border-radius: 10px; text-align: left; }
    .opt-0 { background: #e21b3c; } .opt-1 { background: #1368ce; }
    .opt-2 { background: #d89e00; } .opt-3 { background: #26890c; }
    .timer { font-size: 3rem; font-weight: bold; color: #ff4757; }
    .counter { font-size: 1.5rem; color: #4bcffa; margin: 15px 0; }
    #qrcode { background: white; padding: 15px; display: inline-block; border-radius: 10px; margin: 15px 0; }
    .url { color: #8896b3; font-size: .9rem; word-break: break-all; }
    button { background: #00d2d3; border: none; padding: 14px 28px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; color: #121826; margin: 6px; }
    button:hover { background: #54a0ff; }
    button.danger { background: #ff6b81; }
    .warn { background: #5b2a2a; padding: 12px; border-radius: 8px; margin: 15px 0; }
    table { border-collapse: collapse; margin: 20px auto; font-size: 1rem; }
    th, td { border: 1px solid #36435f; padding: 6px 10px; }
    th { background: #2a3650; }
    td.name { text-align: left; }
    .ok { color: #4cd964; } .bad { color: #ff6b81; } .none { color: #7a869f; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div id="errors" class="warn hidden"></div>

  <!-- Previous session found -->
  <div class="card hidden" id="previous">
    <h1>Previous session found</h1>
    <p>The database still holds data from an earlier run (nothing is erased automatically).</p>
    <button onclick="showPreviousResults()">Show its results</button>
    <button class="danger" onclick="newSession()">Start a NEW session (erases old data)</button>
  </div>

  <!-- Lobby -->
  <div class="card hidden" id="lobby">
    <h1 id="lobby-title"></h1>
    <p>Scan the QR code to join on your phone:</p>
    <div id="qrcode"></div>
    <div class="url" id="url-text"></div>
    <h3>Students joined: <span id="student-count">0</span></h3>
    <button onclick="startGame()">Start Exam</button>
  </div>

  <!-- Question -->
  <div class="card hidden" id="game">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 id="q-number"></h2>
      <div class="timer" id="timer"></div>
    </div>
    <h1 id="q-text" style="font-size:2.3rem; min-height:100px;"></h1>
    <div class="counter">Answers received: <span id="answer-count">0</span> / <span id="total-connected">0</span></div>
    <div class="grid">
      <div class="option opt-0" id="opt-0"></div>
      <div class="option opt-1" id="opt-1"></div>
      <div class="option opt-2" id="opt-2"></div>
      <div class="option opt-3" id="opt-3"></div>
    </div>
  </div>

  <!-- Results -->
  <div class="card hidden" id="results">
    <h1>Exam finished</h1>
    <p id="results-status">Calculating scores…</p>
    <div id="results-table" style="overflow-x:auto;"></div>
    <button id="csv-btn" class="hidden" onclick="downloadCsv()">Download CSV</button>
    <button class="danger" onclick="newSession()">Start a NEW session (erases data)</button>
  </div>

  <script>
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const N = EXAM_QUESTIONS.length;
    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    let currentQIndex = 0, timerInterval = null, timeLeft = 0;
    let totalStudents = 0, answersReceived = 0;
    let examRunning = false, advancing = false;
    let lastRows = [];     // for CSV

    function show(id) {
      ['previous', 'lobby', 'game', 'results'].forEach(x => $(x).classList.toggle('hidden', x !== id));
    }

    // ---------- Check questions.js for typos ----------
    function validateQuestions() {
      const problems = [], ids = new Set();
      EXAM_QUESTIONS.forEach((q, i) => {
        const label = `Question #${i + 1}`;
        if (ids.has(q.id)) problems.push(`${label}: duplicate id ${q.id}`);
        ids.add(q.id);
        if (!Number.isInteger(q.id) || q.id < 1) problems.push(`${label}: id must be a whole number ≥ 1`);
        if (!Array.isArray(q.options) || q.options.length !== 4) problems.push(`${label}: needs exactly 4 options`);
        if (![0, 1, 2, 3].includes(q.correctIndex)) problems.push(`${label}: correctIndex must be 0, 1, 2 or 3`);
      });
      if (problems.length) {
        $('errors').innerHTML = "<b>Fix questions.js:</b><br>" + problems.map(esc).join("<br>");
        $('errors').classList.remove('hidden');
      }
      return problems.length === 0;
    }

    // ---------- Startup ----------
    async function init() {
      if (!validateQuestions()) return;
      $('lobby-title').innerText = EXAM_TITLE;
      $('url-text').innerText = STUDENT_URL;
      new QRCode($('qrcode'), { text: STUDENT_URL, width: 220, height: 220 });

      const { data: state, error } = await db.from('room_state').select('*').eq('id', 1).single();
      if (error) {
        $('errors').innerText = "Cannot reach Supabase: " + error.message;
        $('errors').classList.remove('hidden');
        return;
      }
      if (state.game_status === 'waiting') { await enterLobby(); }
      else { show('previous'); }
    }

    async function refreshStudentCount() {
      const { count } = await db.from('students').select('*', { count: 'exact', head: true });
      totalStudents = count || 0;
      $('student-count').innerText = totalStudents;
      $('total-connected').innerText = totalStudents;
    }

    async function enterLobby() {
      show('lobby');
      await refreshStudentCount();
      db.channel('students-watch')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'students' }, refreshStudentCount)
        .subscribe();
      db.channel('submissions-watch')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'submissions' }, onSubmission)
        .subscribe();
    }

    async function newSession() {
      if (!confirm("This erases ALL students and answers from the database. Download the CSV first if you need it. Continue?")) return;
      await db.from('submissions').delete().neq('question_id', -1);
      await db.from('students').delete().neq('id', '00000000-0000-0000-0000-000000000000');
      await db.from('room_state').update({ current_question: 0, game_status: 'waiting', total_students: 0 }).eq('id', 1);
      location.reload();
    }

    // ---------- Game ----------
    async function startGame() {
      await refreshStudentCount();
      if (totalStudents === 0 && !confirm("No students have joined yet. Start anyway?")) return;
      examRunning = true;
      currentQIndex = 0;
      await db.from('room_state').update({ game_status: 'active', current_question: 0, total_students: totalStudents }).eq('id', 1);
      show('game');
      loadQuestion();
    }

    async function loadQuestion() {
      if (currentQIndex >= N) return finishExam();

      const q = EXAM_QUESTIONS[currentQIndex];
      $('q-number').innerText = `Question ${currentQIndex + 1} of ${N}`;
      $('q-text').innerText = q.question;
      ['A', 'B', 'C', 'D'].forEach((L, i) => $('opt-' + i).innerText = `${L}. ${q.options[i]}`);

      answersReceived = 0;
      advancing = false;
      $('answer-count').innerText = "0";
      $('total-connected').innerText = totalStudents;

      await db.from('room_state').update({ current_question: q.id }).eq('id', 1);

      timeLeft = SECONDS_PER_QUESTION;
      $('timer').innerText = timeLeft;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        $('timer').innerText = Math.max(timeLeft, 0);
        if (timeLeft <= 0) endQuestion();
      }, 1000);
    }

    function onSubmission(payload) {
      if (!examRunning || advancing) return;
      if (payload.new.question_id !== EXAM_QUESTIONS[currentQIndex].id) return;
      answersReceived++;
      $('answer-count').innerText = answersReceived;
      if (totalStudents > 0 && answersReceived >= totalStudents) endQuestion();
    }

    async function endQuestion() {
      if (advancing) return;          // prevents timer + last-answer both advancing
      advancing = true;
      clearInterval(timerInterval);
      await db.from('room_state').update({ current_question: 0 }).eq('id', 1);  // locks student buttons
      currentQIndex++;
      setTimeout(loadQuestion, 1500);
    }

    async function finishExam() {
      examRunning = false;
      show('results');
      await db.from('room_state').update({ game_status: 'finished', current_question: 0 }).eq('id', 1);
      await computeAndShowResults();
    }

    // ---------- Scoring ----------
    async function showPreviousResults() { show('results'); await computeAndShowResults(); }

    async function computeAndShowResults() {
      $('results-status').innerText = "Calculating scores…";
      const { data: students } = await db.from('students').select('name').order('name');
      const { data: subs } = await db.from('submissions').select('*');

      const answerKey = {};
      EXAM_QUESTIONS.forEach(q => answerKey[q.id] = q.correctIndex);

      // mark every submission right/wrong and save that in Supabase
      const marked = (subs || []).filter(s => s.question_id in answerKey)
        .map(s => ({ ...s, is_correct: s.selected_option === answerKey[s.question_id] }));
      for (let i = 0; i < marked.length; i += 500) {
        const { error } = await db.from('submissions').upsert(marked.slice(i, i + 500), { onConflict: 'id' });
        if (error) { $('results-status').innerText = "Could not save marks: " + error.message; }
      }

      const byStudent = {};
      marked.forEach(s => { (byStudent[s.student_name] ||= {})[s.question_id] = s.is_correct; });

      lastRows = (students || []).map(st => {
        const per = EXAM_QUESTIONS.map(q => byStudent[st.name]?.[q.id]);   // true / false / undefined
        return { name: st.name, per, score: per.filter(v => v === true).length };
      });

      let html = "<table><tr><th>Student</th><th>Score</th>" +
        EXAM_QUESTIONS.map((q, i) => `<th>Q${i + 1}</th>`).join("") + "</tr>";
      lastRows.forEach(r => {
        html += `<tr><td class="name">${esc(r.name)}</td><td><b>${r.score} / ${N}</b></td>` +
          r.per.map(v => v === true ? '<td class="ok">✔</td>' : v === false ? '<td class="bad">✘</td>' : '<td class="none">–</td>').join("") +
          "</tr>";
      });
      html += "</table>";
      $('results-table').innerHTML = html;
      $('results-status').innerText = `${lastRows.length} students · scores saved in Supabase (table "submissions", view "results").`;
      $('csv-btn').classList.remove('hidden');
    }

    function downloadCsv() {
      const head = ["Name", "Score", "Total", "Percent", ...EXAM_QUESTIONS.map((q, i) => "Q" + (i + 1))];
      const lines = [head.join(",")];
      lastRows.forEach(r => {
        lines.push([`"${r.name.replace(/"/g, '""')}"`, r.score, N, Math.round(100 * r.score / N) + "%",
          ...r.per.map(v => v === true ? "correct" : v === false ? "wrong" : "no answer")].join(","));
      });
      const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "exam-results.csv";
      a.click();
    }

    init();
  </script>
</body>
</html>
