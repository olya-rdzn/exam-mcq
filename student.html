<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Response</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Verdana, sans-serif; }
    body { background: #121826; color: white; margin: 0; padding: 15px; text-align: center; }
    .box { margin-top: 18vh; }
    input { padding: 15px; font-size: 1.2rem; border-radius: 8px; border: none; width: 85%; max-width: 320px; margin-bottom: 20px; }
    .btn-join { padding: 15px 30px; font-size: 1.2rem; background: #00d2d3; border: none; border-radius: 8px; font-weight: bold; color: #121826; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; height: 80vh; }
    .btn-opt { border: none; border-radius: 12px; font-size: 3.5rem; color: white; font-weight: bold; }
    .btn-opt:active { filter: brightness(1.3); }
    .opt-0 { background: #e21b3c; } .opt-1 { background: #1368ce; }
    .opt-2 { background: #d89e00; } .opt-3 { background: #26890c; }
    .msg { font-size: 1.8rem; margin-top: 30vh; color: #00d2d3; font-weight: bold; line-height: 1.4; }
    .err { color: #ff6b81; font-size: 1.1rem; margin-top: 12px; min-height: 1.4em; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div id="login" class="box">
    <h2 id="title">Exam</h2>
    <p>Enter your full name:</p>
    <input type="text" id="name" placeholder="First & Last Name" autocomplete="off"><br>
    <button class="btn-join" id="join-btn">Join</button>
    <div class="err" id="login-err"></div>
  </div>

  <div id="buttons" class="btn-grid hidden">
    <button class="btn-opt opt-0" data-i="0">A</button>
    <button class="btn-opt opt-1" data-i="1">B</button>
    <button class="btn-opt opt-2" data-i="2">C</button>
    <button class="btn-opt opt-3" data-i="3">D</button>
  </div>

  <div id="msg" class="msg hidden"></div>
  <div class="err" id="game-err"></div>

  <script>
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    document.getElementById('title').innerText = EXAM_TITLE;

    let studentName = "";
    let state = { game_status: 'waiting', current_question: 0 };
    const answered = new Set();   // question ids this student already answered
    let sending = false;

    const $ = id => document.getElementById(id);

    function render() {
      const buttons = $('buttons'), msg = $('msg');
      let text = null;

      if (state.game_status === 'finished') text = "Exam finished.<br>Thank you! 🙂";
      else if (state.game_status === 'waiting') text = "You're in!<br>Waiting for the teacher to start…";
      else if (state.current_question === 0) text = "Get ready…<br>next question is coming";
      else if (answered.has(state.current_question)) text = "✔ Answer submitted<br>Look at the screen";

      if (text) { buttons.classList.add('hidden'); msg.innerHTML = text; msg.classList.remove('hidden'); }
      else { msg.classList.add('hidden'); buttons.classList.remove('hidden'); }
    }

    async function fetchState() {
      const { data } = await db.from('room_state').select('*').eq('id', 1).single();
      if (data) { state = data; render(); }
    }

    async function loadMyAnswers() {
      const { data } = await db.from('submissions').select('question_id').eq('student_name', studentName);
      (data || []).forEach(r => answered.add(r.question_id));
    }

    async function joinRoom(auto) {
      const name = $('name').value.trim().replace(/\s+/g, ' ');
      if (!name) { $('login-err').innerText = "Please enter your name."; return; }
      studentName = name;

      const { error } = await db.from('students').insert([{ name }]);
      // 23505 = name already exists (e.g. page was refreshed): just continue as the same student
      if (error && error.code !== '23505') {
        $('login-err').innerText = "Could not join: " + error.message;
        return;
      }
      try { localStorage.setItem('examName', name); } catch (e) {}

      $('login').classList.add('hidden');
      await loadMyAnswers();
      await fetchState();

      db.channel('room').on('postgres_changes',
        { event: 'UPDATE', schema: 'public', table: 'room_state' },
        payload => { state = payload.new; render(); }).subscribe();

      setInterval(fetchState, 3000);   // safety net in case a realtime message is missed
    }

    async function submitAnswer(i) {
      const qid = state.current_question;
      if (sending || qid === 0 || answered.has(qid)) return;
      sending = true;
      $('game-err').innerText = "";

      const { error } = await db.from('submissions').insert([
        { student_name: studentName, question_id: qid, selected_option: i }
      ]);
      sending = false;

      if (error && error.code !== '23505') {
        $('game-err').innerText = "Not sent — please tap again.";
        return;
      }
      answered.add(qid);
      render();
    }

    $('join-btn').addEventListener('click', joinRoom);
    $('name').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });
    document.querySelectorAll('.btn-opt').forEach(b =>
      b.addEventListener('click', () => submitAnswer(Number(b.dataset.i))));

    // Remember the name so a refresh doesn't kick the student out
    try { const saved = localStorage.getItem('examName'); if (saved) { $('name').value = saved; joinRoom(true); } } catch (e) {}
  </script>
</body>
</html>
