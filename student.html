<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Response</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="questions.js"></script>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { background: #121826; color: white; margin: 0; padding: 15px; text-align: center; }
    .join-box { margin-top: 50px; }
    input { padding: 15px; font-size: 1.2rem; border-radius: 8px; border: none; width: 80%; max-width: 300px; margin-bottom: 20px; }
    button.btn-join { padding: 15px 30px; font-size: 1.2rem; background: #00d2d3; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; height: 75vh; margin-top: 15px; }
    .btn-opt { border: none; border-radius: 12px; font-size: 3rem; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; }
    .opt-0 { background: #e21b3c; }
    .opt-1 { background: #1368ce; }
    .opt-2 { background: #d89e00; }
    .opt-3 { background: #26890c; }
    .submitted { font-size: 1.8rem; margin-top: 40vh; color: #00d2d3; font-weight: bold; }
  </style>
</head>
<body>

  <div class="join-box" id="login-section">
    <h2>Exam</h2>
    <p>Enter your Full Name to start:</p>
    <input type="text" id="student-name" placeholder="First & Last Name"><br>
    <button class="btn-join" onclick="joinRoom()">Join Game</button>
  </div>

  <!-- STEP 2: GAME CONTROLLER -->
  <div id="game-section" style="display: none;">
    <div id="buttons-container" class="btn-grid">
      <button class="btn-opt opt-0" onclick="submitAnswer(0)">A</button>
      <button class="btn-opt opt-1" onclick="submitAnswer(1)">B</button>
      <button class="btn-opt opt-2" onclick="submitAnswer(2)">C</button>
      <button class="btn-opt opt-3" onclick="submitAnswer(3)">D</button>
    </div>
    <div id="status-message" class="submitted" style="display: none;">
      ✔ Answer Submitted!
    </div>
  </div>

  <script>
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let studentName = "";
    let activeQId = 0;
    let answeredCurrent = false;

    async function joinRoom() {
      const input = document.getElementById('student-name').value.trim();
      if (!input) return alert("Please enter your name");
      studentName = input;

      const { error } = await db.from('students').insert([{ name: studentName }]);
      if (error) {
        console.log("Join note:", error.message);
      }

      document.getElementById('login-section').style.display = 'none';
      document.getElementById('game-section').style.display = 'block';

      listenForQuestionChanges();
    }

    function listenForQuestionChanges() {
      db.channel('public:room_state').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'room_state' }, (payload) => {
        const newState = payload.new;
        if (newState.current_question !== activeQId) {
          activeQId = newState.current_question;
          answeredCurrent = false;
          
          document.getElementById('buttons-container').style.display = 'grid';
          document.getElementById('status-message').style.display = 'none';
        }
      }).subscribe();
    }

    async function submitAnswer(optionIndex) {
      if (answeredCurrent || activeQId === 0) return;

      const currentQ = EXAM_QUESTIONS.find(q => q.id === activeQId);
      if (!currentQ) return;
      const isCorrect = (optionIndex === currentQ.correctIndex);

      answeredCurrent = true;

      document.getElementById('buttons-container').style.display = 'none';
      document.getElementById('status-message').style.display = 'block';

      await db.from('submissions').insert([{
        student_name: studentName,
        question_id: activeQId,
        selected_option: optionIndex,
        is_correct: isCorrect
      }]);
    }
  </script>
</body>
</html>
